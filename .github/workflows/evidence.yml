name: Audit evidence

# Files for Google's YouTube API Services audit form, taken from the live site.
# Shares the daily job's concurrency group, so it never runs while a daily run is going.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-receipt
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make the evidence files
        run: |
          base=$(node -p 'require("./data/site-target.json").address')
          npx tsx src/cli.ts evidence --base "$base" --out docs/evidence
          ls -la docs/evidence
      - name: Save them
        run: |
          git config user.name "congress-receipts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then exit 0; fi
          scripts/secret-scan.sh
          git commit -q -m "Audit evidence $(date -u +%F)"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep $((2**i)); done
