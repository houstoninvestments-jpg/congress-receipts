name: Probe data sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UA: "CongressReceipts/0.1 (public-interest news; github.com/houstoninvestments-jpg/congress-receipts)"
    steps:
      - name: House Clerk
        continue-on-error: true
        run: |
          curl -sS -A "$UA" -o fd.zip -w "zip %{http_code} %{size_download}\n" https://disclosures-clerk.house.gov/public_disc/financial-pdfs/2026FD.zip
          unzip -o -q fd.zip && ls -la
          head -c 900 2026FD.xml; echo
          echo "PTR count: $(grep -c '<FilingType>P</FilingType>' 2026FD.xml)"
          python3 - <<'PY' > ids.txt
          import xml.etree.ElementTree as ET, sys
          r=ET.parse('2026FD.xml').getroot()
          ms=[m for m in r if m.findtext('FilingType')=='P']
          ms.sort(key=lambda m:m.findtext('FilingDate') or '')
          for m in ms[-6:]:
            print(m.findtext('DocID'), m.findtext('Last'), m.findtext('StateDst'), m.findtext('FilingDate'))
          PY
          cat ids.txt
          for id in $(cut -d' ' -f1 ids.txt | tail -3); do
            curl -sS -A "$UA" -o p.pdf -w "pdf $id %{http_code} %{size_download} %{content_type}\n" "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/$id.pdf"
            pdftotext -layout p.pdf - | grep -v '^\s*$' | head -45
            sleep 2
          done
      - name: Senate eFD
        continue-on-error: true
        run: |
          curl -sS -A "$UA" https://efdsearch.senate.gov/robots.txt -w "\nrobots %{http_code}\n" | head -20
          sleep 5
          curl -sS -A "$UA" -c jar -o home.html -w "home %{http_code}\n" https://efdsearch.senate.gov/search/home/
          sed -e 's/<[^>]*>//g' home.html | tr -s ' \n' | grep -iE 'prohibit|unlawful|commercial|agree|statement' | head -12
          grep -o 'name="csrfmiddlewaretoken"' home.html | head -1
      - name: Price sources
        continue-on-error: true
        run: |
          for u in "https://stooq.com/q/d/l/?s=spy.us&i=d" "https://www.alphavantage.co/terms_of_service/" "https://www.tiingo.com/about/terms-of-use" "https://query1.finance.yahoo.com/v8/finance/chart/SPY?range=5d&interval=1d" "https://api.nasdaq.com/api/quote/SPY/historical?assetclass=etf&fromdate=2026-01-02&todate=2026-01-10&limit=10" "https://www.nasdaq.com/terms-of-use" "https://eodhd.com/financial-apis/terms-conditions" "https://polygon.io/terms" "https://massive.com/terms"; do
            echo "=== $u"; curl -sS -L --http1.1 -A "Mozilla/5.0 $UA" -m 20 "$u" -o out.txt -w "%{http_code} %{size_download}\n" || true
            head -c 300 out.txt | tr -d '\0'; echo
            sed -e 's/<[^>]*>//g' out.txt | tr -s ' \n' | grep -ioE '.{0,200}(commercial|redistribut|personal use|display|publicly).{0,200}' | head -8
          done
