name: Probe data sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UA: "CongressReceipts/0.1 (public-interest news; github.com/houstoninvestments-jpg/congress-receipts)"
    steps:
      - run: sudo apt-get update -q >/dev/null && sudo apt-get install -y -q poppler-utils >/dev/null
      - name: House PTR text
        continue-on-error: true
        run: |
          for id in 20035408 20035410 20035411; do
            curl -sS -A "$UA" -o p.pdf "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/$id.pdf"
            echo "##### $id"; pdftotext -layout p.pdf - | grep -v '^\s*$' | head -60
            echo "##### raw $id"; pdftotext p.pdf - | grep -v '^\s*$' | head -50
            sleep 2
          done
      - name: Price terms
        continue-on-error: true
        run: |
          curl -sS -L -A "Mozilla/5.0" -o av.pdf https://www.alphavantage.co/terms_of_service/ && pdftotext av.pdf - | tr -s ' \n' | grep -ioE '.{0,300}(commercial|redistribut|display|publicly|news).{0,300}' | head -20
          for u in "https://www.tiingo.com/about/pricing" "https://twelvedata.com/terms" "https://finnhub.io/terms-of-service" "https://site.financialmodelingprep.com/terms-of-service" "https://marketstack.com/terms" "https://fred.stlouisfed.org/series/SP500" "https://www.alphavantage.co/support/"; do
            echo "=== $u"; curl -sS -L -A "Mozilla/5.0" -m 20 "$u" -o out.txt -w "%{http_code} %{size_download}\n" || true
            sed -e 's/<[^>]*>//g' out.txt | tr -s ' \n' | grep -ioE '.{0,250}(commercial|redistribut|personal use|display|publicly|copyright).{0,250}' | head -8
          done
