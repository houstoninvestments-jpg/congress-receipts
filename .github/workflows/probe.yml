name: Probe data sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: sudo apt-get update -q >/dev/null && sudo apt-get install -y -q poppler-utils >/dev/null
      - name: Price terms, full wording
        continue-on-error: true
        run: |
          curl -sS -L -A "Mozilla/5.0" -o av.pdf https://www.alphavantage.co/terms_of_service/ && pdftotext av.pdf av.txt
          tr -s ' \n' ' ' < av.txt | grep -oE 'a\. Alpha Vantage grants.{0,2500}' | head -c 2600; echo
          for u in "https://www.tiingo.com/about/pricing" "https://api.tiingo.com/about/pricing" "https://www.tiingo.com/documentation/general/overview" "https://marketstack.com/terms" "https://marketstack.com/pricing" "https://www.stockdata.org/terms" "https://www.stockdata.org/pricing"; do
            echo; echo "=== $u"; curl -sS -L -A "Mozilla/5.0" -m 20 "$u" -o out.txt -w "%{http_code} %{size_download}\n" || true
            sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<style[^>]*>.*<\/style>//g' -e 's/<[^>]*>/ /g' out.txt | tr -s ' \n' ' ' | grep -ioE '.{0,300}(commercial|redistribut|personal use|internal use|display).{0,300}' | grep -v 'font-face\|display:' | head -6
          done
